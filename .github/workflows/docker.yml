name: Docker container
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    if: (github.event_name != 'pull_request' && ! github.event.pull_request.head.repo.fork) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
    uses: korewaChino/actions/.github/workflows/docker.yml@2ffdf23c4769009384199ef2f048319224dad7bf
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      publish: ${{ github.event_name == 'push' }}

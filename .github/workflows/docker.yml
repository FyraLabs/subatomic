name: Docker container
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    if: (github.event_name != 'pull_request' && ! github.event.pull_request.head.repo.fork) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
    uses: FyraLabs/actions/.github/workflows/docker.yml@2c3af61a6d74f43a802f9b91487d33e302d4de00
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      publish: ${{ github.event_name == 'push' }}

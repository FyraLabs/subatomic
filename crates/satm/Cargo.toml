[package]
name = "satm"
version = "1.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "CLI web client for subatomic-server"
homepage = "https://github.com/FyraLabs/subatomic/tree/main/crates/satm"
repository = "https://github.com/FyraLabs/subatomic"
readme = "README.md"
keywords = ["fedora", "dnf", "rpm", "repodata", "createrepo"]
categories = [
  "development-tools::build-utils",
  "command-line-utilities",
  "api-bindings",
]

[[bin]]
name = "satm"
path = "./main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive", "env"] }
clap-verbosity-flag = { version = "3.0.4", features = [
  "tracing",
], default-features = false }
color-eyre = "0.6.5"
dotenvy = { workspace = true }
hex = { workspace = true }
sha2 = "0.11.0"
libsubatomic = { workspace = true }
multer = "3.1.0"
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = "1.12.1"
async-stream = "0.3.6"
indicatif = "0.18.6"
futures = "0.3.34"

[dependencies.reqwest]
version = "=0.13.5"
default-features = false
features = ["native-tls", "http2", "json", "multipart", "stream"]

[lints]
workspace = true

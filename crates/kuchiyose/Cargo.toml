[package]
name = "libsubatomic-kuchiyose"
version = "1.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Wrappers and utilities for libsubatomic"
homepage = "https://github.com/FyraLabs/subatomic/tree/main/crates/kuchiyose"
repository = "https://github.com/FyraLabs/subatomic"
readme = "README.md"
keywords = ["fedora", "dnf", "rpm", "repodata", "createrepo"]
categories = ["api-bindings"]

[lib]
name = "kuchiyose"
path = "./lib.rs"

[dependencies]
atoi = "3.1.0"
futures = "0.3.34"
tokio = "1.53.1"
tracing = { workspace = true }
object_store.workspace = true
serde = { workspace = true }
sha2 = "0.11.0"
preinterpret = "0.2.1"
thiserror.workspace = true

[dependencies.async-compression]
version = "0.4.46"
features = ["tokio", "zlib", "gzip", "bzip2", "zstdmt", "xz-parallel"]

[lints]
workspace = true

[package]
name = "kiritan"
version = "1.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Next-generation modern RPM repository metadata generator"
homepage = "https://github.com/FyraLabs/subatomic/tree/main/crates/kiritan"
repository = "https://github.com/FyraLabs/subatomic"
readme = "README.md"
keywords = ["fedora", "dnf", "rpm", "repodata", "createrepo"]
categories = ["development-tools::build-utils", "command-line-utilities", "caching"]

[[bin]]
name = "kiritan"
path = "./main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive", "env"] }
color-eyre = "0.6.5"
crossbeam-channel = { workspace = true }
# WARN: deprecated
jwalk = "0.9.0"
kuchiyose = { workspace = true }
libsubatomic = { workspace = true }
num_cpus = "1.17.0"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[package]
name = "libsubatomic"
version = "0.1.0"
edition = "2024"

[lib]
path = "./lib.rs"

[[bin]]
name = "createrepo_rs"
path = "bin/createrepo.rs"

[dependencies]
atoi = "3.1.0"
clap = { version = "4.5.37", features = ["derive"] }
heed = { version = "0.22.1", default-features = false, features = [
  "serde-bincode",
] }
hex = "0.4.3"
itertools = "0.15.0"
pgp = "0.20.0" # fixed by rpm
quick-xml = { version = "0.41.0", features = ["serialize"] }
rand = "0.8.7" # fixed by rpm
rayon = "1.12.0"
rpm = "0.26.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
smartstring = { version = "1.0.1", features = ["serde"] }
tempfile = "3.27.0"
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = "0.13.3"

[lints]
workspace = true

[package]
name = "libsubatomic"
version = "1.0.0"
edition = "2024"

[lib]
path = "./lib.rs"

[dependencies]
async-trait = "0.1.92"
crossbeam-channel = { workspace = true }
futures = "0.3.34"
heed = { version = "0.22.1", default-features = false, features = [
  "serde-bincode",
] }
hex = { workspace = true }
itertools = "0.15.0"
jwalk = "0.9.0"
kuchiyose = { workspace = true }
num_cpus = "1.17.0"
object_store = "0.14.1"
pgp = { workspace = true }
quick-xml = { version = "0.42.0", features = ["serialize"] }
rand = "0.8.8" # fixed by rpm
rayon = { workspace = true }
replace_with = "0.1.8"
rpm = "0.26.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
smallvec = "1.15.2"
smartstring = { version = "1.0.1", features = ["serde"] }
thiserror = "2.0.19"
tokio = { workspace = true }
tokio-util = { version = "0.7.19", features = ["io-util", "io"] }
tracing = "0.1.44"
zstd = { version = "0.13.3", features = ["zstdmt", "fat-lto"] }

[lints]
workspace = true

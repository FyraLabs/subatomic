[package]
name = "libsubatomic"
version = "0.1.0"
edition = "2024"

[lib]
path = "./lib.rs"

[dependencies]
heed = { version = "0.22.1", default-features = false, features = [
  "serde-bincode",
] }
hex = "0.4.3"
itertools = "0.15.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
rayon = "1.12.0"
rpm = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
smartstring = { version = "1.0.1", features = ["serde"] }
zstd = "0.13.3"

[lints]
workspace = true
